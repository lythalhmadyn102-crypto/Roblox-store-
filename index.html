<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Roblox Shop | متجر روبلوكس مع الدعم الفني</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tajawal', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b1a2e 0%, #1a2a3a 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #ffd966;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ffd966, #ff9f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-panel-link, .tickets-link {
            background: #2c3e50;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            border: 1px solid #ffd966;
        }

        .tickets-link {
            background: #1e5f3a;
        }

        .admin-panel-link:hover, .tickets-link:hover {
            background: #e67e22;
            transform: scale(0.98);
        }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .product-card {
            background: rgba(20, 35, 55, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 18px;
            transition: all 0.25s;
            border: 1px solid rgba(255, 217, 102, 0.3);
            text-align: center;
        }

        .product-card:hover {
            transform: translateY(-7px);
            border-color: #ffd966;
            box-shadow: 0 20px 30px -12px black;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            background: #0f1a24;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 12px 0 5px;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd966;
            margin: 8px 0;
        }

        .buy-btn {
            background: #e67e22;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e2a3a;
            max-width: 600px;
            width: 90%;
            border-radius: 40px;
            padding: 30px;
            border-top: 5px solid #ffd966;
            max-height: 85vh;
            overflow-y: auto;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border-radius: 60px;
            border: none;
            background: #2d3e4f;
            color: white;
            font-size: 1rem;
        }

        textarea {
            border-radius: 24px;
            resize: vertical;
        }

        .admin-btn {
            background: #27ae60;
            padding: 12px;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .admin-btn.danger {
            background: #c0392b;
        }

        .close-modal {
            background: #7f8c8d;
            margin-top: 15px;
        }

        /* تذاكر */
        .ticket-item {
            background: #0f1724;
            margin: 12px 0;
            padding: 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .ticket-item:hover {
            background: #1e2a3a;
        }

        .chat-area {
            max-height: 300px;
            overflow-y: auto;
            background: #0f1724;
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
        }

        .message {
            margin: 10px 0;
            padding: 8px 15px;
            border-radius: 20px;
            max-width: 80%;
        }

        .message.customer {
            background: #2c3e50;
            margin-left: auto;
            text-align: right;
        }

        .message.admin {
            background: #e67e22;
            margin-right: auto;
        }

        .ticket-status {
            font-size: 0.8rem;
            color: #ffd966;
        }

        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <h1>🧸 Roblox Shop</h1>
        <p>مع نظام تذاكر الدعم</p>
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="tickets-link" id="myTicketsBtn">🎫 تذاكري</div>
        <div class="admin-panel-link" id="openAdminBtn">🔐 الإدارة</div>
    </div>
</div>

<div class="container">
    <h2>✨ منتجات روبلوكس ✨</h2>
    <div id="productsContainer" class="products-grid"></div>
</div>

<footer>© 2025 Roblox Shop | اضغط شراء ↦ افتح تذكرة للتواصل مع الدعم</footer>

<!-- مودال التذاكر للزبون -->
<div id="ticketsModal" class="modal">
    <div class="modal-content">
        <h2>🎫 تذاكري</h2>
        <div id="customerTicketsList"></div>
        <button id="closeTicketsModal" class="admin-btn close-modal">إغلاق</button>
    </div>
</div>

<!-- مودال التذكرة (محادثة) -->
<div id="chatModal" class="modal">
    <div class="modal-content">
        <h2 id="chatTitle">محادثة التذكرة</h2>
        <div id="chatMessages" class="chat-area"></div>
        <textarea id="chatMessageInput" rows="2" placeholder="اكتب رسالتك هنا..."></textarea>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="sendMessageBtn" class="admin-btn">إرسال</button>
            <button id="closeChatModal" class="admin-btn close-modal">إغلاق</button>
        </div>
    </div>
</div>

<!-- مودال الإدارة (كلمة سر + لوحة تحكم + تذاكر) -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <div id="passwordScreen">
            <h2>🔐 دخول الإدارة</h2>
            <label>كلمة السر:</label>
            <input type="password" id="adminPassword" placeholder="••••••">
            <button id="checkPasswordBtn" class="admin-btn">دخول</button>
            <button id="closeModalBtn" class="admin-btn close-modal">إغلاق</button>
        </div>

        <div id="adminPanelScreen" style="display:none;">
            <h2>⚙️ لوحة التحكم + التذاكر</h2>
            <h3>➕ إضافة منتج</h3>
            <label>اسم المنتج</label>
            <input type="text" id="productName" placeholder="مثلاً: Limited Dragon">
            <label>رابط الصورة</label>
            <input type="text" id="productImage" placeholder="https://example.com/img.jpg">
            <label>السعر</label>
            <input type="number" id="productPrice" placeholder="10">
            <label>العملة</label>
            <select id="productCurrency"><option value="$">دولار ($)</option><option value="JD">دينار أردني (JD)</option></select>
            <button id="addProductBtn" class="admin-btn">➕ إضافة</button>

            <hr style="margin: 25px 0;">
            <h3>📩 تذاكر الدعم (الزبائن)</h3>
            <div id="adminTicketsList"></div>
            <button id="closeAdminPanelBtn" class="admin-btn close-modal">إغلاق الإدارة</button>
        </div>
    </div>
</div>

<script>
    // ------------------- المنتجات -------------------
    let products = [];
    const ADMIN_PASSWORD = "admin123";

    // ------------------- التذاكر -------------------
    // كل تذكرة: { id, productId, productName, customerId, status, messages: [{sender, text, timestamp}] }
    let tickets = [];
    let currentCustomerId = null;   // معرف فريد لكل زبون (يخزن في localStorage)
    let currentOpenTicket = null;    // التذكرة المفتوحة حالياً
    let adminViewingTicket = null;

    // تحميل البيانات
    function loadData() {
        const storedProducts = localStorage.getItem("roblox_shop_products");
        if(storedProducts) products = JSON.parse(storedProducts);
        else {
            products = [
                { id: Date.now()+1, name: "عملاق Robux 100k", image: "https://picsum.photos/id/104/300/200", price: 19.99, currency: "$" },
                { id: Date.now()+2, name: "حساب نادر", image: "https://picsum.photos/id/106/300/200", price: 45, currency: "JD" },
                { id: Date.now()+3, name: "قبعة Valkyrie", image: "https://picsum.photos/id/26/300/200", price: 89, currency: "$" }
            ];
            saveProducts();
        }

        const storedTickets = localStorage.getItem("roblox_tickets");
        if(storedTickets) tickets = JSON.parse(storedTickets);
        else tickets = [];

        // تحديد هوية الزبون (جهاز فريد)
        let customerId = localStorage.getItem("customer_id");
        if(!customerId) {
            customerId = "cust_" + Date.now() + "_" + Math.random().toString(36).substr(2, 8);
            localStorage.setItem("customer_id", customerId);
        }
        currentCustomerId = customerId;

        renderProducts();
    }

    function saveProducts() { localStorage.setItem("roblox_shop_products", JSON.stringify(products)); }
    function saveTickets() { localStorage.setItem("roblox_tickets", JSON.stringify(tickets)); }

    function renderProducts() {
        const container = document.getElementById("productsContainer");
        if(!container) return;
        if(products.length === 0) { container.innerHTML = `<div class="empty-msg">⚠️ لا توجد منتجات</div>`; return; }
        container.innerHTML = products.map(p => `
            <div class="product-card">
                <img class="product-img" src="${p.image}" onerror="this.src='https://picsum.photos/id/20/300/200'">
                <div class="product-title">${escapeHtml(p.name)}</div>
                <div class="product-price">${p.currency} ${p.price}</div>
                <button class="buy-btn" data-id="${p.id}" data-name="${escapeHtml(p.name)}">🛒 شراء وفتح تذكرة</button>
            </div>
        `).join("");
        document.querySelectorAll('.buy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const prodId = parseInt(btn.getAttribute('data-id'));
                const prodName = btn.getAttribute('data-name');
                createTicketForProduct(prodId, prodName);
            });
        });
    }

    // إنشاء تذكرة جديدة عند الشراء
    function createTicketForProduct(productId, productName) {
        // التحقق إن كان فيه تذكرة مفتوحة لنفس المنتج ونفس الزبون ولم تغلق
        const existing = tickets.find(t => t.customerId === currentCustomerId && t.productId === productId && t.status !== "closed");
        if(existing) {
            alert(`❗ لديك تذكرة مفتوحة بالفعل للمنتج "${productName}". افتحها من "تذاكري".`);
            openChatModal(existing.id, false);
            return;
        }
        const newTicket = {
            id: Date.now(),
            productId: productId,
            productName: productName,
            customerId: currentCustomerId,
            status: "open",   // open, closed
            createdAt: new Date().toISOString(),
            messages: [{
                sender: "system",
                text: `✅ تم إنشاء تذكرة للمنتج: ${productName}. يمكنك الآن التواصل مع الدعم.`,
                timestamp: new Date().toISOString()
            }]
        };
        tickets.push(newTicket);
        saveTickets();
        alert(`🎫 تم فتح تذكرة للمنتج "${productName}". يمكنك متابعة المحادثة من زر "تذاكري".`);
        openChatModal(newTicket.id, false);
    }

    // فتح نافذة المحادثة
    function openChatModal(ticketId, isAdminView = false) {
        const ticket = tickets.find(t => t.id === ticketId);
        if(!ticket) return;
        if(!isAdminView && ticket.customerId !== currentCustomerId) { alert("هذه ليست تذكرتك!"); return; }

        currentOpenTicket = ticket;
        const modal = document.getElementById("chatModal");
        const title = document.getElementById("chatTitle");
        title.innerText = `📝 ${ticket.productName} - ${ticket.status === "closed" ? "(مغلقة)" : "مفتوحة"}`;
        renderChatMessages(ticket.id);
        modal.style.display = "flex";
    }

    function renderChatMessages(ticketId) {
        const ticket = tickets.find(t => t.id === ticketId);
        if(!ticket) return;
        const container = document.getElementById("chatMessages");
        if(!container) return;
        if(ticket.messages.length === 0) { container.innerHTML = "<div>لا توجد رسائل بعد</div>"; return; }
        container.innerHTML = ticket.messages.map(msg => `
            <div class="message ${msg.sender === 'customer' ? 'customer' : (msg.sender === 'admin' ? 'admin' : '')}" style="${msg.sender === 'system' ? 'background:#555; text-align:center; max-width:100%;' : ''}">
                <strong>${msg.sender === 'customer' ? '👤 أنت' : (msg.sender === 'admin' ? '🛡️ الإدارة' : '📢 نظام')}</strong><br>
                ${escapeHtml(msg.text)}<br>
                <small style="font-size:10px;">${new Date(msg.timestamp).toLocaleTimeString()}</small>
            </div>
        `).join("");
        container.scrollTop = container.scrollHeight;
    }

    function sendMessageToTicket(ticketId, text, sender) {
        if(!text.trim()) return;
        const ticket = tickets.find(t => t.id === ticketId);
        if(!ticket) return;
        if(ticket.status === "closed" && sender !== "system") {
            alert("هذه التذكرة مغلقة، لا يمكن إرسال رسائل جديدة.");
            return;
        }
        ticket.messages.push({
            sender: sender,
            text: text.trim(),
            timestamp: new Date().toISOString()
        });
        saveTickets();
        renderChatMessages(ticketId);
        if(sender === "admin") renderAdminTicketsList();
        else renderCustomerTicketsList();
    }

    // عرض تذاكر الزبون الحالي
    function renderCustomerTicketsList() {
        const container = document.getElementById("customerTicketsList");
        if(!container) return;
        const myTickets = tickets.filter(t => t.customerId === currentCustomerId);
        if(myTickets.length === 0) { container.innerHTML = "<div class='empty-msg'>لا توجد تذاكر حتى الآن. اشتري منتجًا لفتح تذكرة.</div>"; return; }
        container.innerHTML = myTickets.map(t => `
            <div class="ticket-item" data-id="${t.id}">
                <strong>${escapeHtml(t.productName)}</strong><br>
                الحالة: ${t.status === "open" ? "🟢 مفتوحة" : "🔴 مغلقة"}<br>
                <small>آخر رسالة: ${t.messages.length > 0 ? new Date(t.messages[t.messages.length-1].timestamp).toLocaleString() : "لا رسائل"}</small>
            </div>
        `).join("");
        document.querySelectorAll("#customerTicketsList .ticket-item").forEach(el => {
            el.addEventListener("click", () => openChatModal(parseInt(el.getAttribute("data-id")), false));
        });
    }

    // عرض التذاكر في لوحة الإدارة
    function renderAdminTicketsList() {
        const container = document.getElementById("adminTicketsList");
        if(!container) return;
        if(tickets.length === 0) { container.innerHTML = "<div class='empty-msg'>لا توجد تذاكر حالياً</div>"; return; }
        container.innerHTML = tickets.map(t => `
            <div class="ticket-item" data-id="${t.id}">
                <strong>📦 ${escapeHtml(t.productName)}</strong> | الزبون: ${t.customerId.substring(0,12)}...<br>
                الحالة: ${t.status === "open" ? "🟢 مفتوحة" : "🔴 مغلقة"} | رسائل: ${t.messages.length}<br>
                <div style="display:flex; gap:10px; margin-top:8px;">
                    <button class="admin-btn small" style="background:#3498db;" onclick="event.stopPropagation(); adminViewTicket(${t.id})">💬 فتح المحادثة</button>
                    ${t.status === "open" ? `<button class="admin-btn small" style="background:#e67e22;" onclick="event.stopPropagation(); adminCloseTicket(${t.id})">🔒 إغلاق التذكرة</button>` : `<button class="admin-btn small" style="background:#27ae60;" onclick="event.stopPropagation(); adminReopenTicket(${t.id})">🔓 إعادة فتح</button>`}
                </div>
            </div>
        `).join("");
        // إضافة فتح المحادثة عند الضغط على العنصر نفسه
        document.querySelectorAll("#adminTicketsList .ticket-item").forEach(el => {
            el.addEventListener("click", (e) => {
                if(e.target.tagName !== 'BUTTON') adminViewTicket(parseInt(el.getAttribute("data-id")));
            });
        });
    }

    window.adminViewTicket = (ticketId) => {
        adminViewingTicket = ticketId;
        openChatModal(ticketId, true);
    };
    window.adminCloseTicket = (ticketId) => {
        const ticket = tickets.find(t => t.id === ticketId);
        if(ticket) { ticket.status = "closed"; ticket.messages.push({ sender: "system", text: "🔒 تم إغلاق التذكرة بواسطة الإدارة.", timestamp: new Date().toISOString() }); saveTickets(); renderAdminTicketsList(); renderCustomerTicketsList(); }
    };
    window.adminReopenTicket = (ticketId) => {
        const ticket = tickets.find(t => t.id === ticketId);
        if(ticket) { ticket.status = "open"; ticket.messages.push({ sender: "system", text: "🔓 تم إعادة فتح التذكرة بواسطة الإدارة.", timestamp: new Date().toISOString() }); saveTickets(); renderAdminTicketsList(); renderCustomerTicketsList(); }
    };

    // إدارة المودالات
    const adminModal = document.getElementById("adminModal");
    const ticketsModal = document.getElementById("ticketsModal");
    const chatModal = document.getElementById("chatModal");

    document.getElementById("myTicketsBtn").onclick = () => { renderCustomerTicketsList(); ticketsModal.style.display = "flex"; };
    document.getElementById("closeTicketsModal").onclick = () => ticketsModal.style.display = "none";
    document.getElementById("closeChatModal").onclick = () => chatModal.style.display = "none";
    document.getElementById("sendMessageBtn").onclick = () => {
        if(!currentOpenTicket) return;
        const input = document.getElementById("chatMessageInput");
        const isAdminView = (document.getElementById("adminPanelScreen")?.style.display === "block");
        const sender = isAdminView ? "admin" : "customer";
        sendMessageToTicket(currentOpenTicket.id, input.value, sender);
        input.value = "";
    };
    document.getElementById("openAdminBtn").onclick = () => { adminModal.style.display = "flex"; showPasswordScreen(); };
    document.getElementById("closeModalBtn").onclick = () => adminModal.style.display = "none";
    document.getElementById("closeAdminPanelBtn").onclick = () => adminModal.style.display = "none";
    document.getElementById("checkPasswordBtn").onclick = () => {
        if(document.getElementById("adminPassword").value === ADMIN_PASSWORD) { showAdminPanel(); renderAdminTicketsList(); }
        else alert("كلمة سر خاطئة");
    };
    document.getElementById("addProductBtn").onclick = () => {
        const name = document.getElementById("productName").value.trim();
        const img = document.getElementById("productImage").value.trim() || "https://picsum.photos/id/100/300/200";
        const price = parseFloat(document.getElementById("productPrice").value);
        const curr = document.getElementById("productCurrency").value;
        if(!name || isNaN(price)) { alert("املأ البيانات"); return; }
        products.push({ id: Date.now(), name, image: img, price, currency: curr });
        saveProducts(); renderProducts();
        document.getElementById("productName").value = "";
        document.getElementById("productImage").value = "";
        document.getElementById("productPrice").value = "";
        alert("تمت الإضافة");
    };

    function showPasswordScreen() { document.getElementById("passwordScreen").style.display = "block"; document.getElementById("adminPanelScreen").style.display = "none"; }
    function showAdminPanel() { document.getElementById("passwordScreen").style.display = "none"; document.getElementById("adminPanelScreen").style.display = "block"; renderAdminTicketsList(); }

    window.onclick = (e) => { if(e.target === adminModal) adminModal.style.display = "none"; if(e.target === ticketsModal) ticketsModal.style.display = "none"; if(e.target === chatModal) chatModal.style.display = "none"; };
    function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    loadData();
</script>
</body>
    </html>
