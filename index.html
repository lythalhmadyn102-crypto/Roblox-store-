<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة متجر الألعاب</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:30px;
font-size:40px;
}

.container{
display:grid;
grid-template-columns:350px 1fr;
gap:20px;
}

.panel{
background:#1e293b;
padding:20px;
border-radius:20px;
height:fit-content;
}

.panel h2{
margin-bottom:20px;
color:#38bdf8;
}

input, textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#334155;
color:white;
font-size:16px;
}

textarea{
resize:none;
height:100px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#38bdf8;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0ea5e9;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1e293b;
border-radius:20px;
overflow:hidden;
border:1px solid #334155;
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
border-color:#38bdf8;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card h3{
margin-bottom:10px;
}

.price{
font-size:22px;
color:#38bdf8;
margin:15px 0;
font-weight:bold;
}

.buy-btn{
background:#38bdf8;
padding:12px;
border-radius:12px;
text-align:center;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<h1>🎮 متجر حسابات الألعاب</h1>

<div class="container">

<!-- لوحة التحكم -->

<div class="panel">

<h2>إضافة منتج</h2>

<input type="text" id="title" placeholder="اسم المنتج">

<textarea id="description" placeholder="وصف المنتج"></textarea>

<input type="number" id="price" placeholder="السعر">

<input type="file" id="image">

<button onclick="addProduct()">
إضافة المنتج
</button>

</div>

<!-- المنتجات -->

<div class="products" id="products">

</div>

</div>

<script>

function addProduct(){

let title = document.getElementById("title").value;
let description = document.getElementById("description").value;
let price = document.getElementById("price").value;
let imageInput = document.getElementById("image");

if(title == "" || description == "" || price == "" || imageInput.files.length == 0){
alert("املأ جميع الحقول");
return;
}

let image = URL.createObjectURL(imageInput.files[0]);

let product = `
<div class="card">

<img src="${image}">

<div class="card-content">

<h3>${title}</h3>

<p>${description}</p>

<div class="price">${price}$</div>

<div class="buy-btn">
شراء الآن
</div>

</div>

</div>
`;

document.getElementById("products").innerHTML += product;

document.getElementById("title").value = "";
document.getElementById("description").value = "";
document.getElementById("price").value = "";
document.getElementById("image").value = "";

}

</script>

</body>
    </html>
